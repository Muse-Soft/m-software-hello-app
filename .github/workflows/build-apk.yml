name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK to release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk xin-chao.apk
          gh release delete apk-latest --yes || true
          gh release create apk-latest xin-chao.apk --title "Xin Chào — APK mới nhất" --notes "APK build tự động bằng GitHub Actions (debug)."
